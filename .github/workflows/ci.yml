name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eduflow-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Validate schema and build apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma validates the schema configuration without connecting to a database.
      DATABASE_URL: postgresql://eduflow:ci-only@localhost:5432/eduflow?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: /api/backend
          BACKEND_INTERNAL_API_URL: http://backend:3001/api
        run: npm run build:frontend
