services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: eduflow-backend
    env_file:
      - apps/backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the root .env for Docker Compose}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET in the root .env}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:?Set DEFAULT_USER_PASSWORD in the root .env}
      ROOT_EMAIL: ${ROOT_EMAIL:?Set ROOT_EMAIL in the root .env}
      ROOT_USERNAME: ${ROOT_USERNAME:-root}
      ROOT_NAME: ${ROOT_NAME:-Root Administrator}
      ROOT_PASSWORD: ${ROOT_PASSWORD:?Set ROOT_PASSWORD in the root .env}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in the root .env}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:?Set FRONTEND_ALLOWED_ORIGINS in the root .env}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Loopback-only: the frontend proxies browser API traffic; this port is for host health checks.
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    volumes:
      - ./backups:/app/backups

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}
    container_name: eduflow-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}
      BACKEND_INTERNAL_API_URL: ${BACKEND_INTERNAL_API_URL:-http://backend:3001/api}
      PORT: 3000
    depends_on:
      - backend
    # Cloudflare Tunnel should target localhost:3000; do not publish Next.js to every interface.
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: eduflow-postgres
    environment:
      POSTGRES_DB: eduflow
      POSTGRES_USER: eduflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduflow -d eduflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: eduflow-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

volumes:
  postgres_data:
  redis_data:
