services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: eduflow-backend
    env_file:
      - apps/backend/.env
    environment:
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Loopback-only: the frontend proxies browser API traffic; this port is for host health checks.
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    volumes:
      - ./backups:/app/backups

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/backend}
    container_name: eduflow-frontend
    env_file:
      - apps/frontend/.env.local
    environment:
      PORT: 3000
    depends_on:
      - backend
    # Cloudflare Tunnel should target localhost:3000; do not publish Next.js to every interface.
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: eduflow-postgres
    environment:
      POSTGRES_DB: eduflow
      POSTGRES_USER: eduflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduflow -d eduflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: eduflow-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

volumes:
  postgres_data:
  redis_data:
